<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="chromeBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="65%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#000205"/>
    </radialGradient>

    <!-- Liquid Chrome Shimmer Gradient -->
    <linearGradient id="liquidChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="20%" stop-color="#00f3ff"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="80%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Moving Reflection Shimmer -->
    <linearGradient id="shimmerBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="auraGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="hexGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 24 6 L 24 18 L 12 24 L 0 18 L 0 6 Z" fill="none" stroke="#00f3ff" stroke-width="0.4" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    @keyframes chromeShine {
      0% { transform: translateX(-350px) skewX(-20deg); }
      50%, 100% { transform: translateX(950px) skewX(-20deg); }
    }
    @keyframes pulseAuraRing {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes flowLiquid {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .shimmer-slide {
      animation: chromeShine 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .aura-pulse {
      transform-origin: 425px 120px;
      animation: pulseAuraRing 3.6s ease-in-out infinite;
    }
    .flowing-border {
      stroke-dasharray: 12, 18;
      animation: flowLiquid 4s linear infinite;
    }
    .led-blink {
      animation: blinkLed 1.4s ease-in-out infinite;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .font-chrome {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 0.22em;
    }
  </style>

  <!-- Frame Background -->
  <rect width="850" height="240" fill="url(#chromeBg)" rx="14"/>
  <rect width="850" height="240" fill="url(#hexGrid)" rx="14"/>
  <rect x="2" y="2" width="846" height="236" rx="12" fill="none" stroke="#00f3ff" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Liquid Chromatic Outer Border Flow -->
  <rect class="flowing-border" x="6" y="6" width="838" height="228" rx="10" fill="none" stroke="url(#liquidChrome)" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Central Chromatic Aura Pulse -->
  <ellipse class="aura-pulse" cx="425" cy="120" rx="320" ry="60" fill="#00f3ff" fill-opacity="0.08" filter="url(#auraGlowFilter)"/>
  <ellipse class="aura-pulse" cx="425" cy="120" rx="220" ry="40" fill="#a855f7" fill-opacity="0.08" filter="url(#auraGlowFilter)"/>

  <!-- Top Metadata Bar -->
  <g class="font-mono" font-size="9" fill="#94a3b8" letter-spacing="1">
    <text x="30" y="24" fill="#00f3ff" font-weight="700">▶ IDENTITY_SIGNATURE // CHROME AURA</text>
    <text x="425" y="24" text-anchor="middle" fill="#64748b">MORPHISM STATE: EVOLUTION COMPLETE</text>
    <text x="820" y="24" text-anchor="end" fill="#39ff14"><tspan class="led-blink">●</tspan> HASH: 0x73616b_hust</text>
    <line x1="30" y1="32" x2="820" y2="32" stroke="#00f3ff" stroke-opacity="0.2" stroke-width="1"/>
  </g>

  <!-- Morphism Evolution Flow Concept: NORMAL -> NEURAL -> CHROME -->
  <g class="font-mono" font-size="10" transform="translate(0, 62)">
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="140" height="28" rx="4" fill="#090f1d" stroke="#334155" stroke-width="1"/>
      <text x="70" y="18" fill="#94a3b8" text-anchor="middle" font-weight="600">01 // NORMAL</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 295 14 L 335 14" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="335,11 343,14 335,17" fill="#00f3ff"/>

    <g transform="translate(355, 0)">
      <rect x="0" y="0" width="140" height="28" rx="4" fill="#130924" stroke="#a855f7" stroke-width="1"/>
      <text x="70" y="18" fill="#c084fc" text-anchor="middle" font-weight="600">02 // NEURAL</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 510 14 L 550 14" stroke="#ff007a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="550,11 558,14 550,17" fill="#ff007a"/>

    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="140" height="28" rx="4" fill="#04202c" stroke="#00f3ff" stroke-width="1.5" filter="url(#auraGlowFilter)"/>
      <text x="70" y="18" fill="#00f3ff" text-anchor="middle" font-weight="800">03 // CHROME</text>
    </g>
  </g>

  <!-- Big Chrome Signature Title with Animated Reflection -->
  <g clip-path="url(#chromeClip)" transform="translate(0, 105)">
    <clipPath id="chromeClip">
      <text class="font-chrome" x="425" y="60" font-size="44" text-anchor="middle">
        VIRAKSAK KOY
      </text>
    </clipPath>

    <!-- Base Chrome Fill for Text -->
    <rect x="0" y="0" width="850" height="80" fill="url(#liquidChrome)"/>

    <!-- Sweeping Reflection Beam -->
    <rect class="shimmer-slide" x="0" y="0" width="160" height="80" fill="url(#shimmerBeam)"/>
  </g>

  <!-- Outline Glow Around Name for Definition -->
  <text class="font-chrome" x="425" y="165" font-size="44" text-anchor="middle" fill="none" stroke="#00f3ff" stroke-width="0.75" stroke-opacity="0.8">
    VIRAKSAK KOY
  </text>

  <!-- Bottom Tagline & Coordinates -->
  <g class="font-mono" font-size="10" text-anchor="middle" transform="translate(425, 205)">
    <text fill="#e2e8f0" letter-spacing="3" font-weight="600">
      ARCHITECTING INTELLIGENT REALITIES // DATA SCIENCE AT HUST
    </text>
    <text y="18" fill="#64748b" font-size="9" letter-spacing="2">
      RESEARCH NEVER STOPS ✦ 21.0075° N, 105.8431° E
    </text>
  </g>
</svg>
